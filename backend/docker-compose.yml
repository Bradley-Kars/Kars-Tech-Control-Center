version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kts-postgres-dev
    environment:
      POSTGRES_USER: kts
      POSTGRES_PASSWORD: kts_dev_password_change_me
      POSTGRES_DB: kts_dev
    ports:
      - "5432:5432"
    volumes:
      - kts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kts -d kts_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: kts-postgres-test
    environment:
      POSTGRES_USER: kts_test
      POSTGRES_PASSWORD: kts_test_password_change_me
      POSTGRES_DB: kts_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kts_test -d kts_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kts_postgres_data:
