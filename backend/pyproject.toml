[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kts-core"
version = "1.0.0"
description = "KTS Records Core API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic[email]>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = ["real_install: tests that require this machine's real install (~/.ticketing code, ~/.ticketing-sandbox / ~/Documents/KTS Records-sandbox data, or ~/.local/bin/ticket). Skipped by default; run with -m real_install to execute."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]