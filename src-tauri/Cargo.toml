[package]
name = "master-control"
version = "0.0.1"
description = "KTS Master Control Center"
authors = ["Bradley Kars"]
edition = "2021"

# Versioning Scheme:
# 0.1.# - Small changes, bug fixes, minor features (pre-1.0)
# 0.#.# - New device/service integrations, significant features (pre-1.0)
# 1.0.0 - Production ready, stable API
# 1.0.# - Small changes, bug fixes post-1.0
# 1.#.# - Major feature additions, breaking changes
# #.#.# - Complete rewrites, architecture changes

[lib]
name = "master_control_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "master-control"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
ssh2 = "0.9"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
urlencoding = "2.1.3"
dirs = "5.0"
toml = "0.8"
notify = { version = "6", features = ["mio"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
